# On every push and pull request: install, run the unit tests, type-check and build, and scan for leaked secrets.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build

  # Stops a change that adds a password, key or token. GitHub push protection
  # (turned on in the repository settings) also blocks known key types on push.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # the action lists the commits of a pull request
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
